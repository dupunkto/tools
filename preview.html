<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>HTML</title>
    <link rel="stylesheet" type="text/css" href="main.css">

    <script src="/vendor/prettier.js"></script>
    <script src="/vendor/prettier-html.js"></script>
    <script src="/vendor/prettier-babel.js"></script>
    <script src="/vendor/prettier-estree.js"></script>
    <script src="/vendor/prettier-postcss.js"></script>

    <style>
      header + .bar, h3 {
        margin-bottom: 0.5em;
      }

      textarea {
        font-family: monospace;
      }

      iframe {
        width: 100%;
        min-height: 250px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1><a href="index.html">Tools</a></h1>
    </header>

    <main>
      <header class="bar">
        <h2>HTML</h2>
      </header>

      <div class="bar">
        <h3>Input</h3>
        <button onclick="format()">Format</button>
      </div>

      <textarea placeholder="<h1>hello world</h1>" rows="10" cols="50" id="source"></textarea>

      <h3>Preview</h3>

      <iframe id="preview"></iframe>

      <noscript>
        <small>This tool requires Javascript to work.</small>
      </noscript>
    </main>

    <script>
      const textarea = document.getElementById("source");
      const iframe = document.getElementById("preview");

      textarea.addEventListener("input", () => {
        iframe.srcdoc = textarea.value;
      })

      async function format() {
        try {
          textarea.value = await prettier.format(textarea.value, {
            parser: 'html',
            plugins: prettierPlugins
          });
          iframe.srcdoc = textarea.value;
        } catch(e) {
          alert(`Error: ${e.message}`);
        }
      }
    </script>

    <script src="/vendor/instant-page.js" type="module"></script>
    <script src="/offline.js"></script>
  </body>
</html>
