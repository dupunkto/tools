<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <title>Pronounce</title>

    <link rel="stylesheet" type="text/css" href="main.css" />
  </head>
  <body>
    <header>
      <h1><a href="index.html">Tools</a></h1>
    </header>

    <main>
      <header class="bar">
        <h2>Pronounce</h2>
        <div class="group">
          <select id="engine">
            <option value="simple" selected>Simple</option>
            <option value="espeak">eSpeak</option>
          </select>
          <button id="speak" type="button">Speak</button>
        </div>
      </header>

      <textarea
        id="input"
        placeholder="xɑ ryted tэku эt ɑsy..."
        rows="7"
      >hλ ωʊd</textarea>
    </main>

    <script type="module">
      // Σkɔnik is 1:1 phonetic, so "speaking" a word is just concatenating one
      // audio clip per grapheme. Decode the clips once with the Web Audio API,
      // then schedule them back-to-back on demand. No network at play time.
      //
      // The clips are placeholders (macOS `say` reading approximate syllables),
      // so several phones are wrong and stops carry a faint schwa. Drop better
      // recordings into clips/ under the same names and nothing else changes.

      // grapheme (orthography glyph OR its romanisation key) -> clip id
      const CLIP = {
        // vowels
        'ɑ': 'a_open', 'a': 'a_open', 'ʌ': 'a_open', 'ä': 'a_open', // [ɑ]
        'o': 'o_close',                                             // [o]
        'ɔ': 'o_open',  'c': 'o_open',  'ö': 'o_open',              // [ɔ]
        'i': 'i_lax',                                               // [ɪ]
        'y': 'i_tense',                                             // [i]
        'Σ': 'ai',      'z': 'ai',                                  // [aj]
        'e': 'schwa',                                               // [ə]
        'λ': 'e_mid',   'é': 'e_mid',                               // [e]
        'э': 'e_open',  'ë': 'e_open',                              // [ɛ]
        'u': 'y_round',                                             // [y]
        'ʊ': 'u_close', 'ú': 'u_close',                             // [u]
        'ɤ': 'o_back',  'ü': 'o_back',                              // [ɤ]
        'σ': 'au',      'q': 'au',                                  // [aʊ]
        // consonants
        'd': 'c_d', 'p': 'c_p', 'm': 'c_m', 'n': 'c_n', 't': 'c_t',
        'ţ': 'c_ch', 'T': 'c_ch',                                   // [t͡ʃ]
        's': 'c_s',
        'ȿ': 'c_sh', 'S': 'c_sh',                                   // [ʂ]
        'h': 'c_h',                                                 // [ɦ]
        'g': 'c_g', 'b': 'c_b', 'f': 'c_f', 'v': 'c_v',
        'ʟ': 'c_l', 'l': 'c_l',                                     // [l]
        'ω': 'c_w', 'w': 'c_w',                                     // [ʋ]
        'μ': 'c_j', 'j': 'c_j',                                     // [j]
        'k': 'c_k',
        'r': 'c_r',                                                 // [ɻ]
      };

      const OFFSET = -0.1;        // seconds between phones; slight overlap smooths it
      const WORD_GAP = 0.12;      // pause on whitespace
      const COMPOUND_GAP = 0.07;  // shorter pause on a compound hyphen

      const input = document.getElementById('input');
      const button = document.getElementById('speak');
      const engine = document.getElementById('engine');

      let ctx;

      // Runs from a click handler, so creating the context is allowed.
      function audio_ctx() {
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      }

      // Simple engine

      const buffers = {};
      let decoding;

      function ready() {
        audio_ctx();
        if (!decoding) {
          const ids = [...new Set(Object.values(CLIP))];
          decoding = Promise.all(ids.map(async (id) => {
            const res = await fetch(`clips/${id}.mp3`);
            buffers[id] = await ctx.decodeAudioData(await res.arrayBuffer());
          }));
        }
        return decoding;
      }

      async function speak_simple(text) {
        await ready();
        let t = ctx.currentTime + 0.05;
        for (const ch of text) {
          if (ch === '-') { t += COMPOUND_GAP; continue; }
          if (/\s/.test(ch)) { t += WORD_GAP; continue; }
          // Match exactly first: Σ [aj] vs σ [aʊ] and the T/S romanisation keys
          // are case-distinct, so don't lowercase blindly. Fall back for stray caps.
          const id = CLIP[ch] ?? CLIP[ch.toLowerCase()];
          if (!id) continue; // punctuation / unknown glyph
          const src = ctx.createBufferSource();
          src.buffer = buffers[id];
          src.connect(ctx.destination);
          src.start(Math.max(t, ctx.currentTime));
          t += buffers[id].duration + OFFSET;
        }
      }

      // eSpeak engine (espeak-ng via wasm)

      const ESPEAK_DIR = '/vendor/espeakng/';
      const ESPEAK_RATE = 22050;
      const ESPEAK_VOICE = 'zkc+klatt2';

      // Seconds of silence after a clause, by its final punctuation mark.
      const GAPS = { '.': 0.8, '?': 0.8, '!': 0.8, ',': 0.3, ';': 0.3, ':': 0.3 };

      let espeak;

      async function ensure_espeak() {
        if (espeak) return espeak;
        const { default: create_espeak } = await import(ESPEAK_DIR + 'espeak.js');
        const M = await create_espeak({ locateFile: (f) => ESPEAK_DIR + f });
        const init = M.cwrap('zkc_init', 'number', []);
        const synth = M.cwrap('zkc_synth', 'number', ['string', 'string']);
        init();
        espeak = (text) => {
          const n = synth(text, ESPEAK_VOICE);
          if (n <= 0) return null;
          const p = M._zkc_samples() / 2;
          return M.HEAP16.slice(p, p + n);
        };
        return espeak;
      }

      function clauses(text) {
        const out = [];
        let cur = '';
        for (const ch of text) {
          cur += ch;
          if (GAPS[ch]) { out.push({ text: cur, gap: GAPS[ch] }); cur = ''; }
        }
        out.push({ text: cur, gap: 0 });
        return out.filter((c) => /\S/.test(c.text));
      }

      async function speak_espeak(text) {
        const synth = await ensure_espeak();
        audio_ctx();
        let t = ctx.currentTime + 0.05;

        // espeak lowercases input, which collapses Σ into σ; feed it the
        // romanisation instead.
        for (const clause of clauses(text.replace(/Σ/g, 'z'))) {
          const samples = synth(clause.text);
          if (!samples) continue;
          const buf = ctx.createBuffer(1, samples.length, ESPEAK_RATE);
          const data = buf.getChannelData(0);
          for (let i = 0; i < samples.length; i++) data[i] = samples[i] / 32768;
          const src = ctx.createBufferSource();
          src.buffer = buf;
          src.connect(ctx.destination);
          src.start(Math.max(t, ctx.currentTime));
          t += buf.duration + clause.gap;
        }
      }

      button.onclick = () => {
        const speak = engine.value == 'espeak' ? speak_espeak : speak_simple;
        speak(input.value);
      };
    </script>

    <script src="/vendor/instant-page.js" type="module"></script>
    <script src="/offline.js"></script>
  </body>
</html>
